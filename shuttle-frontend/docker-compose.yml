version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: shuttle_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shuttle_db
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: shuttle_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./infra/redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: shuttle_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db