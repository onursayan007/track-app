# ════════════════════════════════════════════════════════════════════
# Docker Compose — Full Stack (Node.js Backend + AI Service)
# ════════════════════════════════════════════════════════════════════

version: "3.9"

services:
  # ── AI / Analytics Microservice ──────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: fleet-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - AI_SERVICE_API_KEY=${AI_SERVICE_API_KEY:-change-me-in-production}
      - BACKEND_URL=http://backend:3000
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=info
    networks:
      - fleet-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Node.js Backend ──────────────────────────────────────────
  # backend:
  #   build:
  #     context: ./backend
  #   container_name: fleet-backend
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - AI_SERVICE_URL=http://ai-service:8000
  #     - AI_SERVICE_API_KEY=${AI_SERVICE_API_KEY:-change-me-in-production}
  #   networks:
  #     - fleet-internal
  #   depends_on:
  #     ai-service:
  #       condition: service_healthy

networks:
  fleet-internal:
    driver: bridge
    name: fleet-internal
